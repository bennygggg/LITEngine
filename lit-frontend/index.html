<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="LIT — a legal research assistant for Indian law." />
    <title>LIT — Legal research assistant</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F1D1A'/%3E%3Ctext x='8' y='23' font-family='Georgia,serif' font-size='21' font-weight='600' fill='%23F7F5F0'%3EL%3C/text%3E%3Ccircle cx='23' cy='22' r='2.2' fill='%23D68870'/%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme before first paint to avoid a light flash in dark mode.
      try {
        var m = localStorage.getItem('lit-theme') || 'system';
        var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
