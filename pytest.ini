[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    slow: loads the real MiniLM model (deselect with -m "not slow")
    live_server: starts uvicorn in a thread to test streaming behaviour
    smoke: fast checks suitable for the Docker build
filterwarnings =
    ignore::DeprecationWarning
    ignore:Field "model_:UserWarning
